spring:
  application:
    name: ${app.name}
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
server:
  ssl:
    enabled: false
    client-auth: none
app:
  name: JAVARA
  branding:
    powered-by: JAVARA
  time-zone: UTC
  features:
    auth-api: true
    resource-server: true
    rate-limiting: true
  email:
    enabled: true
    verification-token-ttl: 24h
    public-base-url: http://localhost:8080
  security:
    service-auth:
      enabled: true
    mfa:
      enabled: true
      required: false
      default-method: EMAIL_OTP
      allowed-methods:
        - EMAIL_OTP
        - WEBAUTHN
      challenge-ttl: 5m
      max-attempts: 5
      relying-party-id: localhost
      allowed-origins:
        - http://localhost:8080
    password-policy:
      enabled: true
      common-passwords-file: ./config/security/common-passwords.txt
      breached-password-hashes-file: ./config/security/breached-password-hashes.txt
    suspicious-authentication:
      enabled: true
      failed-login:
        enabled: true
        threshold: 5
        window: 10m
        lock-duration: 15m
        action: LOCK_AND_NOTIFY
      new-source:
        enabled: true
        action: NOTIFY
        lock-duration: 15m
      failed-mfa:
        enabled: true
        threshold: 5
        window: 10m
        lock-duration: 15m
        action: LOCK_AND_NOTIFY
      security-change:
        enabled: true
        action: NOTIFY
        lock-duration: 15m
